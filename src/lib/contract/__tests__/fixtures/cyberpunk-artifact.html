<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmokeYard — AI Design, Unfiltered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
  :root {
    /* Color tokens — semantic */
    --color-void: #050507;
    --color-surface: #0b0b12;
    --color-surface-elev: #11111c;
    --color-ink: #f4f4f9;
    --color-ink-mute: #8a8a9e;
    --color-ink-dim: #4a4a5e;
    --color-line: #1f1f2e;
    --color-accent: #c4ff00;   /* acid lime — primary signal */
    --color-magenta: #ff2bd1;  /* hot magenta — secondary */
    --color-cyan: #00e8ff;     /* electric cyan — tertiary */
    --color-danger: #ff3b3b;
    --color-success: #00ff88;

    /* Type */
    --font-display: 'Major Mono Display', 'JetBrains Mono', monospace;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-body: 'Space Grotesk', system-ui, sans-serif;

    --fs-micro: clamp(0.6875rem, 0.65rem + 0.15vw, 0.75rem);
    --fs-small: clamp(0.8125rem, 0.78rem + 0.15vw, 0.875rem);
    --fs-body: clamp(0.9375rem, 0.9rem + 0.2vw, 1.0625rem);
    --fs-lead: clamp(1.125rem, 1rem + 0.5vw, 1.375rem);
    --fs-h3: clamp(1.5rem, 1.2rem + 1.2vw, 2rem);
    --fs-h2: clamp(2.25rem, 1.6rem + 2.8vw, 4rem);
    --fs-h1: clamp(3rem, 1.8rem + 7vw, 9rem);

    --lh-tight: 0.92;
    --lh-snug: 1.15;
    --lh-body: 1.55;

    /* Spacing */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --space-7: 3rem;
    --space-8: 4rem;
    --space-section: clamp(4rem, 2.5rem + 5vw, 9rem);
    --gutter: clamp(1rem, 0.5rem + 2vw, 2.5rem);

    /* Motion */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-snap: cubic-bezier(0.7, 0, 0.2, 1);
    --d-fast: 160ms;
    --d-med: 280ms;
    --d-slow: 480ms;

    /* Radii */
    --r-sm: 2px;
    --r-md: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    background: var(--color-void);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .nav-meta .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-success);
    margin-right: var(--space-2);
    vertical-align: middle;
    box-shadow: 0 0 8px var(--color-success);
    animation: pulse 2s var(--ease-out) infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @media (min-width: 1024px) {
    .nav-meta { display: block; }
  }
</style>
</head>
<body></body>
</html>
